<!doctype html><html lang="en"><meta charset="utf-8"><title>PELAGIC optics verification</title>
<style>body{background:#101b20;color:#e6ede7;font:16px/1.6 Consolas,monospace;padding:40px}pre{white-space:pre-wrap}</style>
<h1>Native WebGPU optical contracts</h1><pre id="results">Running irradiance tests...</pre><script type="module">
import {verifyIrradiance} from './tests/irradiance-gpu.js';
import {verifyCoupling} from './tests/coupling-gpu.js';
import {verifyWaveVisibility} from './tests/visibility-gpu.js';
import {verifyLensMedium} from './tests/lens-gpu.js';
import {verifyCoordinates} from './tests/coordinates-gpu.js';
const out=document.querySelector('#results');
try{
 if(!navigator.gpu)throw Error('WebGPU unavailable. No fallback.');
 const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});
 if(!adapter||adapter.isFallbackAdapter)throw Error('Native hardware WebGPU adapter required');
 const device=await adapter.requestDevice(),errors=[];device.onuncapturederror=e=>errors.push(e.error.message);
 const info=adapter.info,report={time:new Date().toISOString(),adapter:{vendor:info.vendor,architecture:info.architecture,device:info.device,description:info.description},irradiance:await verifyIrradiance(device),errors};
 await device.queue.onSubmittedWorkDone();
 report.coupling=await verifyCoupling(device);
 report.waveVisibility=await verifyWaveVisibility(device);
 report.lensMedium=await verifyLensMedium(device);
 report.coordinates=await verifyCoordinates(device);
 report.status=errors.length===0&&[report.irradiance,report.coupling,report.waveVisibility,report.lensMedium,report.coordinates].every(x=>x.status==='PASS')?'PASS':'FAIL';
 out.textContent=JSON.stringify(report,null,2);document.title='OPTICS '+report.status;
 const stage=new URLSearchParams(location.search).get('stage')||'v03-local';
 await fetch('/__evidence?stage='+encodeURIComponent(stage)+'&name=gpu-optics.json',{method:'POST',body:out.textContent});device.destroy();
}catch(e){out.textContent='FAIL: '+e.stack;document.title='OPTICS FAIL';}
</script></html>
