<!doctype html><html lang="en"><meta charset="utf-8"><title>PELAGIC optics verification</title>
<style>body{background:#101b20;color:#e6ede7;font:16px/1.6 Consolas,monospace;padding:40px}pre{white-space:pre-wrap}</style>
<h1>Native WebGPU optical contracts</h1><pre id="results">Running irradiance tests...</pre><script type="module">
import {verifyIrradiance} from './tests/irradiance-gpu.js';
import {verifyCoupling} from './tests/coupling-gpu.js';
import {verifyWaveVisibility} from './tests/visibility-gpu.js';
import {verifyLensMedium} from './tests/lens-gpu.js';
import {verifyCoordinates} from './tests/coordinates-gpu.js';
import {verifyWaterLayer} from './tests/water-layer-gpu.js';
import {verifyPhaseResidency} from './tests/phase-residency-gpu.js';
import {verifyLightStorage} from './tests/light-storage-gpu.js';
const out=document.querySelector('#results');
try{
 if(!navigator.gpu)throw Error('WebGPU unavailable. No fallback.');
 const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});
 if(!adapter||adapter.isFallbackAdapter||/swiftshader|llvmpipe|software/i.test(JSON.stringify([adapter.info.vendor,adapter.info.architecture,adapter.info.description])))throw Error('Native hardware WebGPU adapter required');
 const device=await adapter.requestDevice(),errors=[];device.onuncapturederror=e=>errors.push(e.error.message);
 const info=adapter.info,report={time:new Date().toISOString(),adapter:{vendor:info.vendor,architecture:info.architecture,device:info.device,description:info.description},irradiance:await verifyIrradiance(device),errors};
 await device.queue.onSubmittedWorkDone();
 report.coupling=await verifyCoupling(device);
 report.waveVisibility=await verifyWaveVisibility(device);
 report.lensMedium=await verifyLensMedium(device);
 report.coordinates=await verifyCoordinates(device);
 const query=new URLSearchParams(location.search);
 if(query.has('waterLayer'))report.waterLayer=await verifyWaterLayer(device);
 if(query.has('phaseResidency'))report.phaseResidency=await verifyPhaseResidency(device);
 if(query.has('lightStorage'))report.lightStorage=await verifyLightStorage(device);
 if(query.has('recoveredTrials')){
   report.direction=await (await import('./tests/wind-direction-gpu.js')).windDirectionChecks(device);
   report.reflectionHit=await (await import('./tests/reflection-intersection-gpu.js')).reflectionIntersectionChecks(device);
   report.reflectionEnergy=await (await import('./tests/reflection-energy-gpu.js')).reflectionEnergyChecks(device);
   report.bubbleVolume=await (await import('./tests/ab11-gpu.js')).bubbleVolumeChecks(device);
 }
 const {time,adapter:adapterInfo,errors:gpuErrors,...checks}=report;
 report.status=!gpuErrors.length&&Object.values(checks).every(check=>check.status==='PASS')?'PASS':'FAIL';
 out.textContent=JSON.stringify(report,null,2);device.destroy();
 const stage=query.get('stage')||'v03-local';
 const saved=await fetch('/__evidence?stage='+encodeURIComponent(stage)+'&name=gpu-optics.json',{method:'POST',body:out.textContent});
 document.title='OPTICS '+report.status;
 if(!saved.ok){out.textContent+='\nEvidence not saved: '+saved.status+' (use a new stage for each run).';document.title+=' / UNSAVED';}
}catch(e){out.textContent='FAIL: '+e.stack;document.title='OPTICS FAIL';}
</script></html>
