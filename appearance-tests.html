<!doctype html><html lang="en"><meta charset="utf-8"><title>PELAGIC appearance checks</title>
<style>body{background:#101b20;color:#e6ede7;font:16px/1.6 Consolas,monospace;padding:40px}pre{white-space:pre-wrap}</style>
<h1>Native WebGPU appearance checks</h1><pre id="results">Running...</pre><script type="module">
import {verifyAppearance} from './tests/appearance-gpu.js';
const out=document.querySelector('#results');
try{
 const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});
 if(!adapter||adapter.isFallbackAdapter)throw Error('Native WebGPU required');
 const device=await adapter.requestDevice(),errors=[];device.onuncapturederror=e=>errors.push(e.error.message);
 const report={adapter:{vendor:adapter.info.vendor,architecture:adapter.info.architecture},appearance:await verifyAppearance(device),errors};
 report.status=report.appearance.status==='PASS'&&!errors.length?'PASS':'FAIL';
 out.textContent=JSON.stringify(report,null,2);document.title='APPEARANCE '+report.status;
 const stage=new URLSearchParams(location.search).get('stage');
 if(stage){const r=await fetch('/__evidence?stage='+encodeURIComponent(stage)+'&name=appearance-gpu.json',{method:'POST',body:out.textContent});if(!r.ok)throw Error('Evidence save '+r.status);}
 device.destroy();
}catch(e){out.textContent='FAIL '+e.stack;document.title='APPEARANCE FAIL';}
</script></html>
