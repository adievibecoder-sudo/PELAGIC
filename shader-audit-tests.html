<!doctype html><html lang="en"><meta charset="utf-8"><title>PELAGIC shader corrections</title>
<h1>Native WebGPU shader corrections</h1><pre id="results">Running...</pre><script type="module">
import {shaderAuditChecks} from './tests/shader-audit-gpu.js';
const out=document.querySelector('#results');
try{
 const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});
 if(!adapter||adapter.isFallbackAdapter)throw Error('Native hardware required');
 const device=await adapter.requestDevice(),errors=[];device.onuncapturederror=e=>errors.push(e.error.message);
 const report={adapter:{vendor:adapter.info.vendor,architecture:adapter.info.architecture},checks:await shaderAuditChecks(device),errors};
 report.status=report.checks.status==='PASS'&&!errors.length?'PASS':'FAIL';
 out.textContent=JSON.stringify(report,null,2);document.title='SHADER '+report.status;
 const stage=new URLSearchParams(location.search).get('stage');
 if(stage){const r=await fetch('/__evidence?stage='+encodeURIComponent(stage)+'&name=shader-gpu.json',{method:'POST',body:out.textContent});if(!r.ok)throw Error('Evidence save '+r.status);}
 device.destroy();
}catch(e){out.textContent='FAIL '+e.stack;document.title='SHADER FAIL';}
</script></html>
