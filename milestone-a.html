<!doctype html><html lang="en"><meta charset="utf-8"><title>PELAGIC Milestone A laboratory</title>
<style>body{margin:0;background:#101b20;color:#e6ede7;font:14px Consolas,monospace}header{padding:10px;display:flex;gap:18px}iframe{border:0;width:100vw;height:calc(100vh - 45px)}button{padding:5px 12px}#status{margin-left:auto}</style>
<header>Milestone A <button id="run">Run</button><button id="stop">Stop after current</button><span id="status">Ready</span></header><iframe id="view" title="Controlled ocean scene"></iframe>
<script type="module">
const args=new URLSearchParams(location.search),mode=args.get('mode')||'stills';
const run=args.get('run');if(!run||!/^[a-z0-9-]{1,24}$/.test(run))throw Error('A unique run name is required');
const cases=[{name:'day-near',sunElev:48,exposure:.95,y:2,pitch:-5.5},{name:'day-high',sunElev:48,exposure:.95,y:50,pitch:-12},
 {name:'gold-near',sunElev:5,exposure:1.3,y:2,pitch:-5.5},{name:'gold-high',sunElev:5,exposure:1.3,y:50,pitch:-12}];
let index=Number(args.get('start')||0),running=false;
let view=document.querySelector('#view');const status=document.querySelector('#status');
function next(){
 if(!running||index>=cases.length){running=false;document.title='MILESTONE A DONE';status.textContent=`${index}/4 complete`;return;}
 const c=cases[index];status.textContent=c.name+' / '+mode;
 const q=new URLSearchParams({preset:'midday',ma:1,cam:`0,${c.y},0,4,${c.pitch}`,cameraMode:'free',quality:args.get('quality')||'Balanced',resolution:1,w:1920,h:1080,
  seed:1307,t:20,frames:100,ui:0,adaptive:0,stage:`v04-ma-${run}`,validate:1,p0:1,p0Profile:1,revision:args.get('revision')||'source-manifest',
  clouds:.5,veil:0,haze:1.4,cloudType:0,sunElev:c.sunElev,exposure:c.exposure,weatherRate:1,seaRate:1});
 for(const key of ['maCloud','maCloudPhase','debug','p0Columns','p0CloudView','clouds','paused','maGlints','maRoughness','maWater','maReflection','maCloudTransport','maAmbient','maBreaking','p0Desat'])if(args.has(key))q.set(key,args.get(key));
 if(mode==='motion'){q.set('video',c.name);q.set('duration',24);q.set('motion','ma-pan');}
 else if(mode==='benchmark'){q.set('benchmark',c.name);q.set('benchmarkSeconds',60);q.set('frames',10000);}
 else q.set('shot',c.name+'.png');
 const fresh=document.createElement('iframe');fresh.id='view';fresh.title='Controlled ocean scene';fresh.src='/?'+q;
 view.replaceWith(fresh);view=fresh;
}
document.querySelector('#run').onclick=()=>{running=true;next();};document.querySelector('#stop').onclick=()=>running=false;
addEventListener('message',e=>{
 if(e.origin!==location.origin||e.source!==view.contentWindow||!['pelagic-capture','pelagic-video','pelagic-benchmark'].includes(e.data?.type))return;
 index++;next();
});
if(args.get('auto')==='1'){running=true;next();}
</script></html>
