<!doctype html><html lang="en"><meta charset="utf-8"><title>Pelagic spectrum ensemble</title><style>body{background:#101b20;color:#e6ede7;font:15px/1.6 Consolas,monospace;padding:40px}pre{white-space:pre-wrap}</style><h1>Native WebGPU spectrum ensemble</h1><pre id="results">Preparing...</pre><script type="module">
import {verifyEnsemble} from './tests/ensemble.js';const out=document.querySelector('#results');
try{const adapter=await navigator.gpu.requestAdapter({powerPreference:'high-performance'});const device=await adapter.requestDevice();const errors=[];device.onuncapturederror=e=>errors.push(e.error.message);const result=await verifyEnsemble(device,s=>out.textContent=s);const report={adapter:{vendor:adapter.info.vendor,architecture:adapter.info.architecture},...result,errors};out.textContent=JSON.stringify(report,null,2);await fetch('/__evidence?stage=stage-01&name=gpu-ensemble.json',{method:'POST',body:out.textContent});document.title='ENSEMBLE '+report.status;device.destroy();}catch(e){out.textContent=e.stack;document.title='ENSEMBLE FAIL';}
</script></html>
